[project]
name = "oc-orchestrator"
version = "0.1.0"
description = "OpenCode-backed multi-agent repository orchestrator"
authors = [{ name = "jaraslau" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.poetry]
packages = [{ include = "orchestrator", from = "src" }]

[tool.poetry.scripts]
oc-orchestrator = "orchestrator.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.9"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
