[project]
name = "oc-orchestrator"
version = "0.1.0"
description = "OpenCode-backed multi-agent repository orchestrator"
authors = [{ name = "jaraslau" }]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
requires-poetry = ">=2.0"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
oc-orchestrator = "orchestrator.cli:main"

[tool.poetry]
packages = [{ include = "orchestrator" }]
include = [{ path = "orchestrator/agents/**/*.md", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.9"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
